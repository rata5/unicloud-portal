# Tests every pull request against MySQL 8.4 (production's database) and PostgreSQL 17
# (staging's). Every merge to main also builds the image, deploys staging on Render at once,
# and deploys production on Azure Container Apps once a reviewer approves it (the "production"
# environment). There is one branch: main.
name: build-and-deploy

on:
  pull_request:
  push:
    branches: [main]

env:
  RESOURCE_GROUP: unicloud-rg           # must match setup-azure.sh
  CONTAINER_ENV: unicloud-env           # must match setup-azure.sh
  CONTAINER_APP: unicloud-portal
  GHCR_USERNAME: rata5  # the account that owns the GHCR_PAT token

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4                 # the same version as on Azure
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: unicloud
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: jdbc:mysql://127.0.0.1:3306/unicloud?user=root&password=test&sslMode=REQUIRED
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test (Flyway applies the migrations to MySQL first)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  # Staging runs on PostgreSQL with the copies in db/migration-postgresql. This runs the same
  # tests there. Staging's deploy waits for it; production's doesn't, so a problem that only
  # PostgreSQL has can never hold up production.
  test-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17               # the same version as staging on Render
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: unicloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/unicloud?user=postgres&password=test
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration-postgresql
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test (Flyway applies the PostgreSQL migrations first)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  # The React app and @unicloud/ui (web/): the API types match the pinned contract
  # (openspec/changes/react-hypermedia-ui/portal-api.openapi.json), then types, tests and the build.
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Types match the contract
        run: npm run gen:api && git diff --exit-code apps/portal/src/api/schema.d.ts
      - name: Type check
        run: npm run typecheck
      - name: Test (components and app)
        run: npm test
      - name: Build (app and package)
        run: npm run build && npm run pack:ui

  build:
    needs: [test, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                    # push images to GitHub Container Registry
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick image name
        id: tag
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "${{ steps.tag.outputs.image }}" .

      - name: Push (main only)
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ steps.tag.outputs.image }}"

  # Render builds staging itself from this commit. The deploy hook names the exact commit, so
  # staging never runs code whose PostgreSQL tests failed. Production doesn't wait for this job.
  deploy-staging:
    needs: [test-postgres, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    concurrency: staging
    steps:
      - name: Ask Render to deploy this commit
        env:
          # The service's Deploy Hook URL (Render: unicloud-portal-staging, Settings). It is a
          # secret: anyone who has it can deploy.
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK" ]]; then
            echo "::warning::RENDER_DEPLOY_HOOK is not set, so staging was not deployed (see the README's 'The pipeline')"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK&ref=$GITHUB_SHA" -o /dev/null
          echo "Render is deploying $GITHUB_SHA to staging. It takes a few minutes." | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The job waits here until a reviewer of the "production" environment approves it
    # (Settings, Environments). Approve after checking the change on staging. When a newer
    # merge arrives, GitHub cancels the older deploy still waiting, so approving always
    # ships the latest main.
    environment:
      name: production
      url: ${{ steps.live.outputs.url }}
    concurrency: production              # never run two deploys at once
    permissions:
      contents: read
      id-token: write                    # lets the job log in to Azure without a stored password
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy (the first run creates the app)
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # The RSA key pair the app signs login tokens with (PEM text). Every replica must use
          # the same pair, or a token issued by one replica is rejected by the next.
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
        run: |
          if [[ -z "$JWT_PRIVATE_KEY" || -z "$JWT_PUBLIC_KEY" ]]; then
            echo "Add the JWT_PRIVATE_KEY and JWT_PUBLIC_KEY repository secrets (see the README's 'The pipeline')" >&2
            exit 1
          fi
          az extension add --name containerapp --upgrade --only-show-errors
          # The app reads app.jwt.private-key / app.jwt.public-key; Spring maps these variables to
          # them and accepts the PEM text directly, so no key file is needed in the image.
          # LOGGING_STRUCTURED_FORMAT_CONSOLE: one JSON object per log line, for the request log
          # that docs/slo.md measures (RequestLogFilter)
          ENV_VARS=(DATABASE_URL=secretref:db-url
                    APP_JWT_PRIVATE_KEY=secretref:jwt-private-key
                    APP_JWT_PUBLIC_KEY=secretref:jwt-public-key
                    LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs)
          if az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" > /dev/null 2>&1; then
            # Single sign-on tokens name the portal's public address as their issuer
            # (docs/sso.md). A brand-new app has no address yet; until the next deploy the app
            # works it out from each request.
            FQDN=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn -o tsv)
            ENV_VARS+=(APP_SSO_ISSUER="https://$FQDN")
            az containerapp secret set -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --secrets db-url="$DATABASE_URL" jwt-private-key="$JWT_PRIVATE_KEY" jwt-public-key="$JWT_PUBLIC_KEY" \
              --output none
            # Java needs 0.5 vCPU and 1 GiB per replica; setting it on every deploy keeps it that way
            az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --image "$IMAGE" --cpu 0.5 --memory 1.0Gi \
              --set-env-vars "${ENV_VARS[@]}" \
              --output none
          else
            # At least 2 replicas (no single point of failure), up to 10 when a replica
            # has more than 20 requests in flight
            az containerapp create -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --environment "$CONTAINER_ENV" \
              --image "$IMAGE" --target-port 8080 --ingress external \
              --registry-server ghcr.io --registry-username "$GHCR_USERNAME" --registry-password "$GHCR_PAT" \
              --cpu 0.5 --memory 1.0Gi \
              --min-replicas 2 --max-replicas 10 \
              --scale-rule-name http-rush --scale-rule-type http --scale-rule-http-concurrency 20 \
              --secrets db-url="$DATABASE_URL" jwt-private-key="$JWT_PRIVATE_KEY" jwt-public-key="$JWT_PUBLIC_KEY" \
              --env-vars "${ENV_VARS[@]}" \
              --output none
          fi

      - name: Check the new version is live
        id: live
        run: |
          URL="https://$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          for attempt in $(seq 1 30); do
            BODY=$(curl -fsS "$URL/health" || true)
            if [[ "$BODY" == *"$GITHUB_SHA"* ]]; then
              echo "Live at $URL" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "The new version did not answer within 5 minutes" >&2
          exit 1

  function:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Is there a function yet?
        id: has
        run: |
          if [[ -f functions/document-check/Dockerfile ]]; then
            echo "dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::functions/document-check/Dockerfile does not exist yet, so there is nothing to build"
            echo "dockerfile=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f functions/document-check/package.json ]]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.has.outputs.node == 'true'
        with:
          node-version: 22
      - name: Test
        if: steps.has.outputs.node == 'true'
        working-directory: functions/document-check
        run: |
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm run test --if-present
      - name: Build the image
        if: steps.has.outputs.dockerfile == 'true'
        run: docker build -t document-check functions/document-check

  deploy-staging-check:
    needs: function
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    concurrency: staging-check
    permissions:
      contents: read
      id-token: write                    
    env:
      DEPLOY_ENV: staging
      PORTAL_URL: ${{ vars.PORTAL_URL_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - name: Is Google Cloud set up?
        id: gcp
        run: |
          if [[ -z "${{ vars.GCP_PROJECT_ID }}" || -z "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]]; then
            echo "::warning::The GCP_* variables are not set, so the document check was not deployed (README, 'The pipeline')"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: google-github-actions/auth@v2
        if: steps.gcp.outputs.ready == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.gcp.outputs.ready == 'true'
      - name: Deploy the document check
        if: steps.gcp.outputs.ready == 'true'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: infra/deploy-function.sh

  deploy-staging-site:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    concurrency: staging-site
    permissions:
      contents: read
    env:
      PORTAL_URL: ${{ vars.PORTAL_URL_STAGING }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Put the public site together
        if: env.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != ''
        run: infra/build-public-site.sh site
      - uses: cloudflare/wrangler-action@v3
        if: env.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=unicloud-public --branch=staging --commit-hash=${{ github.sha }} --commit-dirty=true
      - name: Cloudflare is not set up
        if: env.CLOUDFLARE_API_TOKEN == '' || vars.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so the public site was not deployed"

  deploy-check:
    needs: function
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: production-check
    permissions:
      contents: read
      id-token: write                    
    env:
      DEPLOY_ENV: prod
      PORTAL_URL: ${{ vars.PORTAL_URL_PRODUCTION }}
    steps:
      - uses: actions/checkout@v4
      - name: Is Google Cloud set up?
        id: gcp
        run: |
          if [[ -z "${{ vars.GCP_PROJECT_ID }}" || -z "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]]; then
            echo "::warning::The GCP_* variables are not set, so the document check was not deployed (README, 'The pipeline')"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: google-github-actions/auth@v2
        if: steps.gcp.outputs.ready == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.gcp.outputs.ready == 'true'
      - name: Deploy the document check
        if: steps.gcp.outputs.ready == 'true'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: infra/deploy-function.sh

  deploy-site:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: production-site
    permissions:
      contents: read
    env:
      PORTAL_URL: ${{ vars.PORTAL_URL_PRODUCTION }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Put the public site together
        if: env.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != ''
        run: infra/build-public-site.sh site
      - uses: cloudflare/wrangler-action@v3
        if: env.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=unicloud-public --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
      - name: Cloudflare is not set up
        if: env.CLOUDFLARE_API_TOKEN == '' || vars.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so the public site was not deployed"