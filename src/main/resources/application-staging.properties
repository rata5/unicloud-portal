# Staging (Render), turned on with SPRING_PROFILES_ACTIVE=staging. Never on production.

# Module developers may use any callback URL, for example their own http://localhost
# (docs/sso.md, "Callback URLs per environment")
app.sso.callback-policy=any

# The staging profile also turns on the staging tools at /staging and /api/v1/staging/**:
# anyone can create users with any role and permissions, and register SSO clients, without
# logging in (docs/sso.md, "Testing a module against staging"). StagingToolsController.

# One JSON object per log line (Elastic Common Schema), with the request log's fields
# (RequestLogFilter). Production sets the same with LOGGING_STRUCTURED_FORMAT_CONSOLE (deploy.yml).
# Locally, logs stay plain text (tests with the staging profile log JSON too).
logging.structured.format.console=ecs
