<!DOCTYPE html>
<!-- The password change, and the forced first change (PasswordController). Texts as on the fork's
     Rust portal (accounts/handlers.rs). -->
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Смяна на парола · UniCloud</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="card card-narrow">
    <p class="muted" th:text="${name}">Име</p>
    <h1>Смяна на парола</h1>
    <p th:if="${forced}">Това е първото ви влизане. Изберете своя парола, за да продължите.</p>
    <p class="error" role="alert" th:if="${error}" th:text="${error}">Грешка</p>

    <form method="post" action="/password">
        <input type="hidden" name="csrf" th:value="${csrf}">

        <label for="password">Текуща парола</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <label for="new_password">Нова парола (поне 8 знака)</label>
        <input id="new_password" name="new_password" type="password" autocomplete="new-password" required>

        <label for="new_password2">Повторете новата парола</label>
        <input id="new_password2" name="new_password2" type="password" autocomplete="new-password" required>

        <button type="submit">Запази</button>
    </form>

    <form method="post" action="/logout">
        <input type="hidden" name="csrf" th:value="${csrf}">
        <button type="submit" class="btn-secondary">Изход</button>
    </form>
</main>
</body>
</html>
