<!DOCTYPE html>
<!-- The password change and the forced first change (PasswordController). Markup and texts as on
     the fork's Rust portal (accounts/handlers.rs, password_view). -->
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Смяна на парола')}"></head>
<body>
<header th:replace="~{layout :: topbar}"></header>
<main id="main">
    <section class="card narrow">
        <h1>Смяна на парола</h1>
        <p th:if="${forced}">Това е първото ви влизане. Изберете своя парола, за да продължите.</p>
        <div class="flash flash-error" role="status" th:if="${error}" th:text="${error}">Грешка</div>
        <form method="post" action="/password">
            <input type="hidden" name="csrf" th:value="${csrf}">
            <label class="field">
                <span>Текуща парола</span>
                <input type="password" name="password" value="" required autocomplete="current-password">
            </label>
            <label class="field">
                <span>Нова парола (поне 8 знака)</span>
                <input type="password" name="new_password" value="" required autocomplete="new-password">
            </label>
            <label class="field">
                <span>Повторете новата парола</span>
                <input type="password" name="new_password2" value="" required autocomplete="new-password">
            </label>
            <button class="primary" type="submit">Запази</button>
        </form>
    </section>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
