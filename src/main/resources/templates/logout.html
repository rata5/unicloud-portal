<!DOCTYPE html>
<!-- The logout confirmation (PasswordController.confirmLogout): a module asked to sign the user out
     without a valid id_token_hint, so the user confirms. Only the POST ends the session. Markup and
     texts as on the fork's Rust portal (src/ui/components.rs, confirm_logout). -->
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Изход')}"></head>
<body>
<header th:replace="~{layout :: topbar}"></header>
<main id="main">
    <section class="card narrow">
        <h1>Изход от UniCloud?</h1>
        <p>Ще излезете от портала и от всички модули в този браузър.</p>
        <form method="post" action="/logout">
            <input type="hidden" name="csrf" th:value="${csrf}">
            <button class="primary" type="submit">Изход</button>
            <a href="/">Отказ</a>
        </form>
    </section>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
